name: nexus_build
description: BuildMate - Professional Construction Estimator (100% Offline)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (cloud sign-in and data sync)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4

  # Offline local storage (saves everything on the phone, no internet)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Password hashing for local login security
  crypto: ^3.0.3

  # Generates unique IDs for each project/record
  uuid: ^4.4.0

  # Date and number formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Export and Sharing
  share_plus: ^10.1.4
  printing: ^5.13.0
  pdf: ^3.11.1

  # Local Notifications (on-device only)
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
