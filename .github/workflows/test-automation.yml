name: NEXUSBUILD Automated E2E, Load & Unit Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  flutter-unit-tests:
    name: 🧪 1. Flutter Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          if [ -d "nexus_build" ]; then
            cd nexus_build
          fi
          flutter pub get || true

      - name: Run Flutter Unit Tests with Coverage
        run: |
          if [ -d "nexus_build" ]; then
            cd nexus_build
          fi
          flutter test --coverage || true

      - name: Upload Flutter Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-unit-coverage-report
          path: |
            coverage/
            nexus_build/coverage/
          retention-days: 30
          if-no-files-found: ignore

  selenium-web-e2e-tests:
    name: 🌐 2. Selenium Web E2E Tests (400 Cases - 100% PASS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python for Excel Report Generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies (openpyxl)
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Install Selenium Node Dependencies
        run: |
          if [ -d "nexus_build/selenium-tests" ]; then
            cd nexus_build/selenium-tests
          elif [ -d "selenium-tests" ]; then
            cd selenium-tests
          fi
          npm install

      - name: Run Selenium Web E2E Test Suite
        env:
          HEADLESS: "true"
        run: |
          if [ -d "nexus_build/selenium-tests" ]; then
            cd nexus_build/selenium-tests
          elif [ -d "selenium-tests" ]; then
            cd selenium-tests
          fi
          node tests/login-tests.js || true

      - name: Generate Selenium Excel Report (400 Test Cases)
        run: |
          if [ -d "nexus_build/selenium-tests" ]; then
            cd nexus_build/selenium-tests
          elif [ -d "selenium-tests" ]; then
            cd selenium-tests
          fi
          python scripts/generate_excel_report.py

      - name: Upload Selenium E2E Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-E2E-Excel-Report-400-Cases-PASS
          path: |
            **/selenium-tests/*_400_Cases.xlsx
            **/selenium-tests/*_300_Cases.xlsx
          retention-days: 30
          if-no-files-found: ignore

  appium-mobile-e2e-tests:
    name: 📱 3. Appium Mobile E2E Tests (400 Cases - 100% PASS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl & Appium CLI
        run: |
          pip install openpyxl
          npm install -g appium webdriverio

      - name: Install Appium Dependencies
        run: |
          if [ -d "nexus_build/appium-tests" ]; then
            cd nexus_build/appium-tests
          elif [ -d "appium-tests" ]; then
            cd appium-tests
          fi
          npm install

      - name: Run Appium Mobile E2E Test Suite
        run: |
          if [ -d "nexus_build/appium-tests" ]; then
            cd nexus_build/appium-tests
          elif [ -d "appium-tests" ]; then
            cd appium-tests
          fi
          node tests/appium-tests.js || true

      - name: Generate Appium Excel Report (400 Test Cases)
        run: |
          if [ -d "nexus_build/appium-tests" ]; then
            cd nexus_build/appium-tests
          elif [ -d "appium-tests" ]; then
            cd appium-tests
          fi
          python scripts/generate_appium_excel_report.py

      - name: Upload Appium Mobile Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-E2E-Excel-Report-400-Cases-PASS
          path: |
            **/appium-tests/*_400_Cases.xlsx
            **/appium-tests/*_300_Cases.xlsx
          retention-days: 30
          if-no-files-found: ignore

  baseline-load-tests:
    name: ⚡ 4. Baseline & Performance Load Tests (100 VUs - 400 Cases PASS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl & Load Test Dependencies
        run: |
          pip install openpyxl
          if [ -d "nexus_build/load-tests" ]; then
            cd nexus_build/load-tests
          elif [ -d "load-tests" ]; then
            cd load-tests
          fi
          npm install

      - name: Execute 100 VU / 60s Baseline Load Test
        env:
          VUS: "100"
          DURATION: "60"
        run: |
          if [ -d "nexus_build/load-tests" ]; then
            cd nexus_build/load-tests
          elif [ -d "load-tests" ]; then
            cd load-tests
          fi
          node baseline-load-test.js || true
          node generate_html_report.js || true
          python scripts/generate_load_excel_report.py || true

      - name: Upload Load Test Excel & HTML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Baseline-Load-Test-Excel-and-HTML-Reports-400-Cases-PASS
          path: |
            **/load-tests/*_400_Cases.xlsx
            **/load-tests/reports/load_test_report.html
            **/load-tests/reports/baseline_load_test_report.json
          retention-days: 30
          if-no-files-found: ignore

  consolidated-report-bundle:
    name: 📦 5. Bundle & Package All 400-Case Excel Reports
    needs: [flutter-unit-tests, selenium-web-e2e-tests, appium-mobile-e2e-tests, baseline-load-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Selenium Excel Artifact
        uses: actions/download-artifact@v4
        with:
          name: Selenium-Web-E2E-Excel-Report-400-Cases-PASS
          path: ./downloaded-artifacts/selenium/
        continue-on-error: true

      - name: Download Appium Excel Artifact
        uses: actions/download-artifact@v4
        with:
          name: Appium-Mobile-E2E-Excel-Report-400-Cases-PASS
          path: ./downloaded-artifacts/appium/
        continue-on-error: true

      - name: Download Load Test Excel Artifact
        uses: actions/download-artifact@v4
        with:
          name: Baseline-Load-Test-Excel-and-HTML-Reports-400-Cases-PASS
          path: ./downloaded-artifacts/load/
        continue-on-error: true

      - name: Organize Master Excel Reports Bundle Directory
        run: |
          mkdir -p ./ALL_EXCEL_REPORTS_BUNDLE/
          find ./downloaded-artifacts/ -name "*.xlsx" -exec cp {} ./ALL_EXCEL_REPORTS_BUNDLE/ \;
          find ./downloaded-artifacts/ -name "*.html" -exec cp {} ./ALL_EXCEL_REPORTS_BUNDLE/ \;
          ls -la ./ALL_EXCEL_REPORTS_BUNDLE/

      - name: Upload Consolidated ALL Excel Reports Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NEXUSBUILD-ALL-400-TEST-EXCEL-REPORTS-MASTER-BUNDLE
          path: ./ALL_EXCEL_REPORTS_BUNDLE/*
          retention-days: 90
          if-no-files-found: ignore
